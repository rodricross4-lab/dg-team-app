name: DG Team App CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/real-data-foundation

jobs:
  validate:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run typecheck
        run: npm run typecheck

      - name: Build app
        run: npm run build
